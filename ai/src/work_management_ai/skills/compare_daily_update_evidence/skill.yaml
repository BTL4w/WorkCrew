schema_version: "1.0"
name: compare_daily_update_evidence
version: "1.0.0"
owner: progress-agent
description: Prepare an owner-reviewed daily report and compare claims with authorized originals.
runnable_by_agents: [daily_update]
allowed_tools: [daily_update.prepare@1]
