schema_version: "1.0"
agent:
  id: daily_update
  name: Daily Update Agent
  version: "1.0.0"
  owner: progress-agent
  activation_phase: 4
capabilities: [daily_update.prepare]
contracts:
  input: work_management_ai.runtime.contracts.AgentHandoff
  output: work_management_ai.runtime.contracts.AgentResult
  handoff: work_management_ai.runtime.contracts.AgentHandoff
permissions:
  roles: [ADMIN, MANAGER, EMPLOYEE]
  tenant_scope: actor_membership
  risk_ceiling: PROPOSAL_ONLY
runtime:
  workflow: daily-update.v1
  max_iterations: 8
  max_tool_calls: 12
  max_handoffs: 0
  max_replans: 0
  max_model_attempts: 3
  max_input_tokens: 24000
  max_output_tokens: 4000
  timeout_seconds: 180
  checkpoint: durable
  model_policy: structured_owner_draft_original_evidence
allowed_skills: [extract_daily_update@1, compare_daily_update_evidence@1]
allowed_tools: [daily_update.prepare@1]
approval:
  produced_writes: ALWAYS
  can_self_approve: false
fallback:
  strategy: MANUAL_DAILY_UPDATE
evaluators: [daily_update_grounding@1]
stop_conditions: [invalid_handoff, budget_exhausted, needs_input, await_owner, peer_handoff_requested]
