schema_version: "2.0"
agent:
  id: retrieve
  name: Retrieve Agent
  version: "1.0.0"
  owner: knowledge-retrieval
  activation_phase: 5
activation:
  required_track: I3
  requires_core_exit: true
  requires_provider: true
capabilities: [retrieval.search_web, retrieval.summarize_web]
contracts:
  input: work_management_ai.agents.retrieve.contracts.RetrieveInput
  output: work_management_ai.agents.retrieve.contracts.RetrieveOutput
  handoff: work_management_ai.runtime.contracts.AgentHandoff
permissions:
  roles: [ADMIN, MANAGER, EMPLOYEE]
  tenant_scope: actor_membership
  risk_ceiling: READ_ONLY
runtime:
  workflow: retrieve.web.v1
  max_model_attempts: 2
  max_input_tokens: 12000
  max_output_tokens: 3200
  max_iterations: 12
  max_tool_calls: 8
  max_handoffs: 0
  max_replans: 0
  timeout_seconds: 25
  checkpoint: durable
  model_policy: grounded_web_synthesis
retrieval_limits:
  max_queries: 2
  results_per_query: 5
  max_page_reads: 3
  max_provider_requests: 8
  max_sources: 8
  max_evidence_tokens: 4000
  max_output_tokens_per_attempt: 1600
  retrieval_timeout_seconds: 8
  synthesis_timeout_seconds: 20
allowed_skills: [web_search_and_summarize@1]
allowed_tools: [web.search@1, web.read_pages@1, web.revalidate@1]
approval:
  produced_writes: NEVER
  can_self_approve: false
fallback:
  strategy: VERIFIED_EVIDENCE_ONLY
evaluators: [retrieve_grounding@1]
stop_conditions:
  - inactive_capability
  - actor_revoked
  - forbidden_egress
  - budget_exhausted
  - source_expired
  - cancelled
