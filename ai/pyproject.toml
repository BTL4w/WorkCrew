[project]
name = "work-management-ai"
version = "0.1.0"
description = "Provider-neutral AI engineering package for work management"
requires-python = ">=3.13,<3.14"
dependencies = [
    "langchain>=1.3,<1.4",
    "langchain-openai>=1.4,<1.5",
    "langgraph>=1.2,<1.3",
    "langsmith>=0.14.4,<0.15",
    "pydantic>=2,<3",
    "pyyaml>=6.0,<7.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1,<2.0",
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "ruff>=0.15,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests", "src/work_management_ai/agents"]
markers = [
    "live_provider: requires explicit provider credentials and network access",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["work_management_ai"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
